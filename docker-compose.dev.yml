services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: whatsapp-dozzle
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      DOZZLE_FILTER: name=whatsapp-*
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - whatsapp-backend
    restart: unless-stopped
